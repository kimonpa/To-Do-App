<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To - do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login screen: the only thing shown when nobody is logged in. -->
  <section id="login-screen" class="login">
    <!-- Decorative icons: football, piano, runner, gymnast, tennis and maths/physics formulas. -->
    <div class="icons" aria-hidden="true">
      <span class="icon" style="--x:6%;--y:8%;--r:-12deg;--s:2.6rem;--d:0s">⚽</span>
      <span class="icon" style="--x:19%;--y:19%;--r:10deg;--s:2.8rem;--d:1.2s">🎹</span>
      <span class="icon" style="--x:5%;--y:35%;--r:0deg;--s:2.6rem;--d:2.1s">🏃</span>
      <span class="icon formula" style="--x:13%;--y:50%;--r:-8deg;--s:1.6rem;--d:0.6s">E = mc²</span>
      <span class="icon" style="--x:7%;--y:64%;--r:14deg;--s:2.6rem;--d:1.8s">🤸</span>
      <span class="icon" style="--x:18%;--y:77%;--r:-20deg;--s:2.2rem;--d:0.3s">🎾</span>
      <span class="icon formula" style="--x:6%;--y:90%;--r:6deg;--s:1.5rem;--d:2.4s">∫ x² dx</span>
      <span class="icon" style="--x:88%;--y:7%;--r:0deg;--s:2.6rem;--d:1.0s">🏃</span>
      <span class="icon formula" style="--x:75%;--y:17%;--r:7deg;--s:1.7rem;--d:2.6s">F = ma</span>
      <span class="icon" style="--x:91%;--y:31%;--r:15deg;--s:2.4rem;--d:0.4s">⚽</span>
      <span class="icon" style="--x:80%;--y:45%;--r:-9deg;--s:2.8rem;--d:1.6s">🎹</span>
      <span class="icon formula" style="--x:88%;--y:57%;--r:-6deg;--s:1.6rem;--d:2.9s">A = πr²</span>
      <span class="icon" style="--x:79%;--y:69%;--r:-14deg;--s:2.6rem;--d:0.9s">🤸</span>
      <span class="icon" style="--x:91%;--y:83%;--r:18deg;--s:2.2rem;--d:2.2s">🎾</span>
      <span class="icon formula" style="--x:68%;--y:92%;--r:-4deg;--s:1.4rem;--d:1.4s">Δx·Δp ≥ ħ/2</span>
      <span class="icon formula optional" style="--x:36%;--y:4%;--r:-3deg;--s:1.5rem;--d:0.8s">a² + b² = c²</span>
      <span class="icon optional" style="--x:52%;--y:5%;--r:12deg;--s:2.2rem;--d:1.9s">🎾</span>
      <span class="icon optional" style="--x:64%;--y:3%;--r:-10deg;--s:2.4rem;--d:2.7s">⚽</span>
      <span class="icon formula optional" style="--x:30%;--y:93%;--r:4deg;--s:1.5rem;--d:1.1s">e^(iπ) + 1 = 0</span>
      <span class="icon optional" style="--x:48%;--y:92%;--r:-6deg;--s:2.6rem;--d:0.2s">🎹</span>
      <span class="icon formula optional" style="--x:56%;--y:96%;--r:3deg;--s:1.4rem;--d:2.0s">v = d / t</span>
      <span class="icon optional" style="--x:26%;--y:3%;--r:0deg;--s:2.4rem;--d:1.5s">🏃</span>
      <span class="icon optional" style="--x:74%;--y:4%;--r:10deg;--s:2.4rem;--d:0.7s">🤸</span>
      <span class="icon formula optional" style="--x:23%;--y:64%;--r:-5deg;--s:1.3rem;--d:2.3s">√2 ≈ 1.414</span>
    </div>

    <div class="login-card">
      <h1>To - do App</h1>
      <p>Enter your name to get started.</p>
      <form id="login-form">
        <label for="username" class="visually-hidden">Your name</label>
        <input type="text" id="username" placeholder="Your name" autocomplete="off" maxlength="40" required>
        <button type="submit">Log in</button>
      </form>
    </div>
  </section>

  <!-- App screen: shown only after login. -->
  <main id="app-screen" class="app" hidden>
    <div class="app-header">
      <div>
        <h1>To - do App</h1>
        <p id="greeting"></p>
      </div>
      <button type="button" id="logout-button">Log out</button>
    </div>

    <form id="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input type="text" id="task-input" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>
    <p id="empty-message">No tasks yet. Add your first one above.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
